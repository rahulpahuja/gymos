# Netlify deployment configuration for GymOS
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # firebase-applet-config.json is git-ignored (contains project credentials).
  # Fall back to the checked-in example so CI/preview builds still succeed;
  # a real deploy should provide the genuine file or Netlify build env values.
  command = "cp -n firebase-applet-config.example.json firebase-applet-config.json || true; npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# SPA fallback: let the client router handle all routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
