# Netlify deployment configuration for GymOS
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

# Set the Firebase web config (VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN,
# VITE_FIREBASE_PROJECT_ID, VITE_FIREBASE_STORAGE_BUCKET,
# VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_FIREBASE_APP_ID, and optionally
# VITE_FIREBASE_MEASUREMENT_ID / VITE_FIREBASE_FIRESTORE_DATABASE_ID) under
# Netlify -> Site settings -> Environment variables. See .env.example.
[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# SPA fallback: let the client router handle all routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
